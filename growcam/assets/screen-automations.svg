<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="GrowCam Automations honesty strip">
  <rect width="720" height="320" rx="16" fill="#0A140F"/>
  <rect x="0" y="0" width="720" height="36" fill="#0C1812"/>
  <text x="20" y="23" fill="#ECF6EE" font-family="Inter,sans-serif" font-size="12" font-weight="700">Automations</text>
  <text x="120" y="23" fill="#8FA898" font-family="Inter,sans-serif" font-size="11">When this → water or climate</text>
  <!-- card -->
  <rect x="20" y="56" width="680" height="120" rx="14" fill="#14241C" stroke="#2A4534"/>
  <text x="36" y="84" fill="#ECF6EE" font-family="Inter,sans-serif" font-size="14" font-weight="700">When soil on Bed A is low → irrigate 3 min</text>
  <text x="36" y="106" fill="#8FA898" font-family="Inter,sans-serif" font-size="11">Target · Bed A · bed valve</text>
  <rect x="36" y="120" width="148" height="36" rx="8" fill="rgba(52,211,153,0.1)" stroke="#34D399"/>
  <text x="48" y="142" fill="#34D399" font-family="Inter,sans-serif" font-size="11" font-weight="600">Sensor must confirm · ON</text>
  <rect x="194" y="120" width="100" height="36" rx="8" fill="#1A2E24" stroke="#2A4534"/>
  <text x="206" y="142" fill="#8FA898" font-family="Inter,sans-serif" font-size="11">Dry-run · OK</text>
  <rect x="304" y="120" width="120" height="36" rx="8" fill="#1A2E24" stroke="#2A4534"/>
  <text x="316" y="142" fill="#38BDF8" font-family="Inter,sans-serif" font-size="11">Budget 12 min left</text>
  <rect x="520" y="120" width="160" height="36" rx="8" fill="#1A2E24" stroke="#2A4534" opacity="0.55"/>
  <text x="540" y="142" fill="#5A6E62" font-family="Inter,sans-serif" font-size="11">Arm for real · blocked</text>
  <!-- disease notify -->
  <rect x="20" y="192" width="680" height="100" rx="14" fill="#14241C" stroke="rgba(234,140,80,0.4)"/>
  <text x="36" y="220" fill="#EA8C50" font-family="Inter,sans-serif" font-size="13" font-weight="700">Possible issue in Bed B — take a look.</text>
  <text x="36" y="242" fill="#8FA898" font-family="Inter,sans-serif" font-size="12">Notify only; we won't spray or dose.</text>
  <rect x="36" y="256" width="100" height="24" rx="8" fill="rgba(234,140,80,0.12)" stroke="#EA8C50"/>
  <text x="48" y="272" fill="#EA8C50" font-family="Inter,sans-serif" font-size="10" font-weight="700">NOTIFY ONLY</text>
</svg>