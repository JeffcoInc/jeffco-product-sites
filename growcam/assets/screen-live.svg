<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="GrowCam Live — Propose to Confirm rail">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E1A14"/><stop offset="100%" stop-color="#0A140F"/></linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4ADE80"/><stop offset="100%" stop-color="#166534"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="440" rx="16" fill="url(#gbg)"/>
  <!-- chrome -->
  <rect x="0" y="0" width="720" height="40" fill="#0C1812"/>
  <circle cx="22" cy="20" r="7" fill="url(#leafG)"/>
  <text x="36" y="24" fill="#ECF6EE" font-family="Inter,sans-serif" font-size="12" font-weight="700">JeffCo GrowCam</text>
  <text x="160" y="24" fill="#4ADE80" font-family="Inter,sans-serif" font-size="11" font-weight="600">Live</text>
  <text x="200" y="24" fill="#5A6E62" font-family="Inter,sans-serif" font-size="11">Plants</text>
  <text x="250" y="24" fill="#5A6E62" font-family="Inter,sans-serif" font-size="11">Beds</text>
  <text x="290" y="24" fill="#5A6E62" font-family="Inter,sans-serif" font-size="11">Automations</text>
  <!-- honesty rail -->
  <rect x="16" y="52" width="688" height="36" rx="8" fill="#14241C" stroke="#2A4534"/>
  <text x="28" y="74" fill="#5A6E62" font-family="ui-monospace,monospace" font-size="10">LOCKS</text>
  <rect x="78" y="60" width="130" height="20" rx="10" fill="rgba(52,211,153,0.14)" stroke="#34D399"/>
  <circle cx="92" cy="70" r="3" fill="#34D399"/><text x="100" y="74" fill="#34D399" font-family="Inter,sans-serif" font-size="10">Sensor must confirm</text>
  <rect x="218" y="60" width="90" height="20" rx="10" fill="rgba(52,211,153,0.1)" stroke="#2A4534"/>
  <text x="230" y="74" fill="#8FA898" font-family="Inter,sans-serif" font-size="10">Dry-run latch</text>
  <rect x="318" y="60" width="140" height="20" rx="10" fill="rgba(251,191,36,0.12)" stroke="#FBBF24"/>
  <text x="330" y="74" fill="#FBBF24" font-family="Inter,sans-serif" font-size="10">Propose · Confirm pending</text>
  <text x="580" y="74" fill="#5A6E62" font-family="ui-monospace,monospace" font-size="10">physMoved · false</text>
  <!-- propose banner -->
  <rect x="16" y="98" width="688" height="34" rx="8" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.35)"/>
  <text x="28" y="119" fill="#ECF6EE" font-family="Inter,sans-serif" font-size="11" font-weight="600">Vision proposes dry — soil must confirm before any valve opens.</text>
  <!-- propose→confirm -->
  <rect x="16" y="142" width="688" height="32" rx="8" fill="#101C16"/>
  <text x="28" y="162" fill="#5A6E62" font-family="ui-monospace,monospace" font-size="9">PROPOSE→CONFIRM</text>
  <rect x="150" y="148" width="110" height="20" rx="6" fill="rgba(251,191,36,0.15)" stroke="#FBBF24"/>
  <text x="160" y="162" fill="#FBBF24" font-family="Inter,sans-serif" font-size="10">1 · Vision propose</text>
  <text x="268" y="162" fill="#5A6E62" font-size="12">→</text>
  <rect x="285" y="148" width="110" height="20" rx="6" fill="rgba(251,191,36,0.1)" stroke="#FBBF24"/>
  <text x="295" y="162" fill="#FBBF24" font-family="Inter,sans-serif" font-size="10">2 · Soil confirm</text>
  <text x="402" y="162" fill="#5A6E62" font-size="12">→</text>
  <rect x="420" y="148" width="120" height="20" rx="6" fill="#14241C" stroke="#2A4534"/>
  <text x="430" y="162" fill="#5A6E62" font-family="Inter,sans-serif" font-size="10">3 · Valve (not lit)</text>
  <!-- feed -->
  <rect x="16" y="186" width="420" height="236" rx="12" fill="#0A1610" stroke="#2A4534"/>
  <circle cx="36" cy="206" r="4" fill="#F87171" filter="url(#glow)"/>
  <text x="46" y="210" fill="#8FA898" font-family="Inter,sans-serif" font-size="10">LIVE cam-house-1</text>
  <!-- plant boxes -->
  <rect x="48" y="230" width="100" height="120" rx="6" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.7"/>
  <text x="54" y="246" fill="#4ADE80" font-family="Inter,sans-serif" font-size="9">Basil 1 · 0.91</text>
  <rect x="180" y="250" width="90" height="100" rx="6" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.55"/>
  <text x="186" y="266" fill="#34D399" font-family="Inter,sans-serif" font-size="9">Spicy Boi</text>
  <rect x="300" y="240" width="110" height="130" rx="6" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.65" stroke-dasharray="4 3"/>
  <text x="306" y="256" fill="#FBBF24" font-family="Inter,sans-serif" font-size="9">propose dry</text>
  <!-- canopy hud -->
  <rect x="28" y="360" width="140" height="48" rx="8" fill="rgba(20,36,28,0.92)" stroke="#2A4534"/>
  <text x="38" y="378" fill="#8FA898" font-size="9" font-family="ui-monospace,monospace">ExG canopy  42%</text>
  <text x="38" y="392" fill="#FBBF24" font-size="9" font-family="ui-monospace,monospace">Soil  confirm</text>
  <text x="38" y="400" fill="#5A6E62" font-size="9" font-family="ui-monospace,monospace">Valve  held</text>
  <!-- side cards -->
  <rect x="452" y="186" width="252" height="70" rx="10" fill="#14241C" stroke="#2A4534"/>
  <text x="466" y="210" fill="#ECF6EE" font-size="12" font-weight="600" font-family="Inter,sans-serif">Vision propose</text>
  <text x="466" y="228" fill="#8FA898" font-size="10" font-family="Inter,sans-serif">Bed A · waiting on soil</text>
  <text x="466" y="244" fill="#FBBF24" font-size="10" font-family="ui-monospace,monospace">Active</text>
  <rect x="452" y="268" width="252" height="70" rx="10" fill="#14241C" stroke="#2A4534"/>
  <text x="466" y="292" fill="#ECF6EE" font-size="12" font-weight="600" font-family="Inter,sans-serif">Soil confirm</text>
  <text x="466" y="310" fill="#8FA898" font-size="10" font-family="Inter,sans-serif">28% · in band · last 5m</text>
  <text x="466" y="326" fill="#34D399" font-size="10" font-family="ui-monospace,monospace">OK</text>
  <rect x="452" y="350" width="252" height="72" rx="10" fill="#14241C" stroke="#2A4534"/>
  <text x="466" y="374" fill="#ECF6EE" font-size="12" font-weight="600" font-family="Inter,sans-serif">Valve</text>
  <text x="466" y="392" fill="#8FA898" font-size="10" font-family="Inter,sans-serif">No pulse · dry-run only</text>
  <text x="466" y="408" fill="#5A6E62" font-size="10" font-family="ui-monospace,monospace">Held</text>
</svg>