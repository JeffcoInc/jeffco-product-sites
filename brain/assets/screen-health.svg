<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Brain Health severity stack">
  <rect width="720" height="300" rx="16" fill="#080B14"/>
  <text x="24" y="36" fill="#E8EEF8" font-family="IBM Plex Sans,sans-serif" font-size="18" font-weight="700">Health</text>
  <text x="110" y="36" fill="#8B9BB0" font-size="12" font-family="Inter,sans-serif">Critical stays critical · soft heal subordinate</text>
  <rect x="24" y="56" width="672" height="90" rx="12" fill="rgba(248,113,113,0.1)" stroke="rgba(248,113,113,0.45)"/>
  <text x="40" y="84" fill="#F87171" font-family="Inter,sans-serif" font-size="14" font-weight="700">Critical — GrowCam soil stale. Actuators stay cautious.</text>
  <text x="40" y="108" fill="#E8EEF8" font-size="12" font-family="Inter,sans-serif">Next: Open Hardware · soil-bed-a</text>
  <rect x="40" y="118" width="100" height="20" rx="6" fill="rgba(248,113,113,0.15)" stroke="#F87171"/>
  <text x="52" y="132" fill="#F87171" font-size="10" font-weight="700" font-family="Inter,sans-serif">File repair</text>
  <rect x="150" y="118" width="120" height="20" rx="6" fill="#141C2A" stroke="#2A3548"/>
  <text x="160" y="132" fill="#64748B" font-size="10" font-family="Inter,sans-serif">Retry (secondary)</text>
  <rect x="24" y="160" width="672" height="56" rx="12" fill="#141C2A" stroke="#2A3548"/>
  <text x="40" y="184" fill="#FFB020" font-size="13" font-weight="600" font-family="Inter,sans-serif">Couldn’t self-heal — outside policy. File a repair or check SafetyDefaults.</text>
  <text x="40" y="204" fill="#8B9BB0" font-size="11" font-family="ui-monospace,monospace">Heal blocked · no success toast</text>
  <rect x="24" y="230" width="672" height="48" rx="12" fill="#141C2A" stroke="#2A3548"/>
  <text x="40" y="258" fill="#8B9BB0" font-size="12" font-family="Inter,sans-serif">All green. — only when zero warn/critical remain. Never over an open critical.</text>
</svg>