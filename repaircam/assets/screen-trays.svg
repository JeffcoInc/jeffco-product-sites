<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="RepairCam tray board">
  <rect width="720" height="300" rx="16" fill="#0A0C12"/>
  <text x="24" y="36" fill="#E8EEF4" font-family="Space Grotesk,sans-serif" font-size="18" font-weight="700">Trays</text>
  <text x="100" y="36" fill="#8B97A8" font-family="Inter,sans-serif" font-size="12">Pit-crew board · occupied only on claim / OCR / tap</text>
  <!-- grid -->
  <g font-family="ui-monospace,monospace" font-size="11">
    <rect x="24" y="56" width="100" height="70" rx="10" fill="#161C26" stroke="#E8A317"/>
    <text x="36" y="78" fill="#E8A317" font-weight="700">T1</text>
    <text x="36" y="98" fill="#E8EEF4">Bolt-A</text>
    <text x="36" y="114" fill="#34D399">conf 94%</text>
    <rect x="136" y="56" width="100" height="70" rx="10" fill="#161C26" stroke="#2C3648"/>
    <text x="148" y="78" fill="#94A3B8" font-weight="700">T2</text>
    <text x="148" y="98" fill="#64748B">empty</text>
    <rect x="248" y="56" width="100" height="70" rx="10" fill="#161C26" stroke="#FBBF24"/>
    <text x="260" y="78" fill="#FBBF24" font-weight="700">T3</text>
    <text x="260" y="98" fill="#FBBF24">???</text>
    <text x="260" y="114" fill="#8B97A8">OCR miss</text>
    <rect x="360" y="56" width="100" height="70" rx="10" fill="#161C26" stroke="#2C3648"/>
    <text x="372" y="78" fill="#94A3B8" font-weight="700">T4</text>
    <text x="372" y="98" fill="#64748B">empty</text>
    <rect x="472" y="56" width="100" height="70" rx="10" fill="#161C26" stroke="#E8A317"/>
    <text x="484" y="78" fill="#E8A317" font-weight="700">T5</text>
    <text x="484" y="98" fill="#E8EEF4">Cover-L</text>
    <text x="484" y="114" fill="#34D399">conf 88%</text>
    <rect x="584" y="56" width="112" height="70" rx="10" fill="#161C26" stroke="#F87171"/>
    <text x="596" y="78" fill="#F87171" font-weight="700">T6</text>
    <text x="596" y="98" fill="#F87171">unconfirmed</text>
    <text x="596" y="114" fill="#8B97A8">tap / empty</text>
  </g>
  <rect x="24" y="150" width="672" height="120" rx="12" fill="#161C26" stroke="#2C3648"/>
  <text x="40" y="178" fill="#E8EEF4" font-family="Inter,sans-serif" font-size="13" font-weight="700">Can’t read tray number — show me or tap the slot. We won’t guess.</text>
  <text x="40" y="202" fill="#8B97A8" font-family="Inter,sans-serif" font-size="12">Dry-run highlight never flips occupancy. Claim / OCR / operator tap only.</text>
  <rect x="40" y="220" width="110" height="30" rx="8" fill="rgba(232,163,23,0.15)" stroke="#E8A317"/>
  <text x="58" y="239" fill="#E8A317" font-family="Inter,sans-serif" font-size="12" font-weight="700">Show me</text>
  <rect x="160" y="220" width="110" height="30" rx="8" fill="#10141C" stroke="#2C3648"/>
  <text x="178" y="239" fill="#94A3B8" font-family="Inter,sans-serif" font-size="12">Tap slot</text>
</svg>