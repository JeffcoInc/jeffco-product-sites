<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="RepairCam Live Detect Propose Confirm">
  <rect width="720" height="440" rx="16" fill="#0A0C12"/>
  <rect width="720" height="40" fill="#10141C"/>
  <circle cx="22" cy="20" r="7" fill="#E8A317"/>
  <text x="36" y="24" fill="#E8EEF4" font-family="Space Grotesk,Inter,sans-serif" font-size="12" font-weight="700">JeffCo RepairCam</text>
  <text x="170" y="24" fill="#E8A317" font-size="11" font-weight="600" font-family="Inter,sans-serif">Live</text>
  <text x="210" y="24" fill="#64748B" font-size="11" font-family="Inter,sans-serif">Parts</text>
  <text x="255" y="24" fill="#64748B" font-size="11" font-family="Inter,sans-serif">Trays</text>
  <text x="300" y="24" fill="#64748B" font-size="11" font-family="Inter,sans-serif">Session</text>
  <!-- modes -->
  <rect x="16" y="52" width="110" height="28" rx="8" fill="rgba(232,163,23,0.18)" stroke="#E8A317"/>
  <text x="36" y="70" fill="#E8A317" font-family="Inter,sans-serif" font-size="11" font-weight="700">Tear-down</text>
  <rect x="132" y="52" width="100" height="28" rx="8" fill="#161C26" stroke="#2C3648"/>
  <text x="152" y="70" fill="#34D399" font-family="Inter,sans-serif" font-size="11">Build-up</text>
  <rect x="238" y="52" width="80" height="28" rx="8" fill="#161C26" stroke="#2C3648"/>
  <text x="258" y="70" fill="#94A3B8" font-family="Inter,sans-serif" font-size="11">Pause</text>
  <rect x="480" y="52" width="224" height="28" rx="8" fill="#161C26" stroke="#2C3648"/>
  <text x="492" y="70" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="10">Tools latch · DISARMED</text>
  <!-- occlusion hero -->
  <rect x="16" y="92" width="688" height="40" rx="10" fill="rgba(248,113,113,0.1)" stroke="rgba(248,113,113,0.45)"/>
  <text x="28" y="116" fill="#F87171" font-family="Inter,sans-serif" font-size="12" font-weight="700">Lost sight — show me the part or tray. Guide paused until we see it again.</text>
  <!-- pipeline -->
  <rect x="16" y="144" width="688" height="32" rx="8" fill="#10141C"/>
  <text x="28" y="164" fill="#64748B" font-family="ui-monospace,monospace" font-size="9">DETECT→PROPOSE→CONFIRM</text>
  <rect x="200" y="150" width="88" height="20" rx="6" fill="rgba(125,211,252,0.12)" stroke="#7DD3FC"/>
  <text x="210" y="164" fill="#7DD3FC" font-size="10" font-family="Inter,sans-serif">1 Detect</text>
  <text x="296" y="164" fill="#64748B">→</text>
  <rect x="312" y="150" width="110" height="20" rx="6" fill="rgba(232,163,23,0.12)" stroke="#E8A317"/>
  <text x="322" y="164" fill="#E8A317" font-size="10" font-family="Inter,sans-serif">2 Propose tray</text>
  <text x="430" y="164" fill="#64748B">→</text>
  <rect x="446" y="150" width="120" height="20" rx="6" fill="#161C26" stroke="#2C3648"/>
  <text x="456" y="164" fill="#64748B" font-size="10" font-family="Inter,sans-serif">3 Confirm placed</text>
  <!-- feed + AR paused -->
  <rect x="16" y="188" width="430" height="232" rx="12" fill="#080A10" stroke="#2C3648"/>
  <circle cx="36" cy="208" r="4" fill="#F87171"/>
  <text x="46" y="212" fill="#8B97A8" font-size="10" font-family="Inter,sans-serif">LIVE bay-cam · AR PAUSED</text>
  <rect x="80" y="240" width="120" height="90" rx="6" fill="none" stroke="#E8A317" stroke-dasharray="5 4" opacity="0.45"/>
  <text x="90" y="258" fill="#E8A317" font-size="10" opacity="0.7" font-family="Inter,sans-serif">tray halo · dim</text>
  <ellipse cx="320" cy="300" rx="50" ry="30" fill="none" stroke="#FBBF24" stroke-dasharray="3 3" opacity="0.35"/>
  <text x="280" y="305" fill="#FBBF24" font-size="9" opacity="0.6" font-family="Inter,sans-serif">origin ghost</text>
  <rect x="28" y="370" width="160" height="36" rx="8" fill="rgba(22,28,38,0.95)" stroke="#2C3648"/>
  <text x="40" y="392" fill="#94A3B8" font-size="10" font-family="ui-monospace,monospace">OriginPose · 2D</text>
  <!-- side -->
  <rect x="462" y="188" width="242" height="100" rx="10" fill="#161C26" stroke="#2C3648"/>
  <text x="476" y="214" fill="#E8EEF4" font-size="12" font-weight="700" font-family="Inter,sans-serif">Detected — not in a tray yet</text>
  <text x="476" y="234" fill="#8B97A8" font-size="11" font-family="Inter,sans-serif">Claim to assign a slot.</text>
  <rect x="476" y="248" width="120" height="26" rx="8" fill="rgba(232,163,23,0.15)" stroke="#E8A317"/>
  <text x="498" y="265" fill="#E8A317" font-size="11" font-weight="700" font-family="Inter,sans-serif">Show me</text>
  <rect x="462" y="300" width="242" height="120" rx="10" fill="#161C26" stroke="#2C3648"/>
  <text x="476" y="326" fill="#E8EEF4" font-size="12" font-weight="700" font-family="Inter,sans-serif">BOM rail</text>
  <text x="476" y="348" fill="#7DD3FC" font-size="11" font-family="ui-monospace,monospace">detected · 3</text>
  <text x="476" y="368" fill="#E8A317" font-size="11" font-family="ui-monospace,monospace">claim pending · 1</text>
  <text x="476" y="388" fill="#F87171" font-size="11" font-family="ui-monospace,monospace">critical out · 1 · unknown</text>
  <text x="476" y="408" fill="#94A3B8" font-size="10" font-family="Inter,sans-serif">Guidance only — no tools</text>
</svg>